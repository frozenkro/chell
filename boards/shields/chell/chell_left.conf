CONFIG_SPI=y

# OLED display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_LVGL=y
CONFIG_LV_Z_FONT_MONTSERRAT_14=y
CONFIG_LV_Z_THEME_DEFAULT=y

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=210
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=65
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35

# zmk mouse emulation for trackball/trackpad
CONFIG_ZMK_POINTING=y

# mouse key support (clicks via keymap)
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# encoder support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
